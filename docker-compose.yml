# ─────────────────────────────────────────────
# DOCKER COMPOSE — Notes MCP Server
# ─────────────────────────────────────────────
#
# Uso:
#   Desarrollo local:   docker compose up --build
#   Producción (VPS):   el pipeline hace docker compose pull + up -d
#
# En producción la imagen viene de GitHub Container Registry (GHCR).
# En local puedes hacer build directamente con --build.

services:
  notes-mcp:
    # En producción usa la imagen publicada por el pipeline en GHCR.
    # En local, si no existe la imagen remota, haz: docker compose up --build
    image: ghcr.io/dniskav/notes-mcp:latest
    build: .  # fallback para desarrollo local

    # Nombre del contenedor (útil para docker logs, docker exec, etc.)
    container_name: notes-mcp

    # Mapeo de puertos: puerto_host:puerto_contenedor
    # En producción Caddy hace de proxy, así que el puerto
    # del host no necesita ser público (puedes cambiarlo)
    ports:
      - "3000:3000"

    # Variables de entorno
    environment:
      - PORT=3000
      - NODE_ENV=production

    # Volumen para persistir las notas
    # Si el contenedor se reinicia o actualiza, las notas no se pierden
    # ./data en tu máquina/VPS ↔ /app/data dentro del contenedor
    volumes:
      - ./data:/app/data

    # Política de reinicio: si el proceso muere, Docker lo relanza
    # unless-stopped = se reinicia siempre excepto si lo paras manualmente
    restart: unless-stopped

    # Health check: Docker comprueba cada 30s que el servidor responde
    # Si falla 3 veces seguidas, marca el contenedor como "unhealthy"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
